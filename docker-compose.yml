services:
  backtest:
    build: .
    # SECURITY: No network access — strategy cannot phone home
    network_mode: "none"
    # SECURITY: Read-only root filesystem
    read_only: true
    # Allow tmp for numpy/pandas scratch space
    tmpfs:
      - /tmp:size=512m
    # Resource limits — prevent runaway strategies
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"
    # Default command uses hardened runner (AST validation + audit trail)
    command: ["backtest_sandboxed.py"]
    # Mount strategy as single file (read-only from host)
    # Mount data cache as read-only
    # Mount results as read-only (output goes to stdout/JSON)
    volumes:
      - ./strategy.py:/app/strategy.py:ro
      - ${DATA_DIR:-~/.cache/autotrader/data}:/app/data:ro
    environment:
      - AUTOTRADER_DATA_DIR=/app/data
      - PYTHONDONTWRITEBYTECODE=1
    # Security options
    security_opt:
      - no-new-privileges:true
    # Drop all capabilities
    cap_drop:
      - ALL
    # Non-root user (set in Dockerfile)
    # Timeout at container level (safety net beyond Python timeout)
    stop_grace_period: 10s

  # Separate service for data download (NEEDS network)
  download:
    build: .
    command: ["prepare.py"]
    volumes:
      - ${DATA_DIR:-~/.cache/autotrader/data}:/app/data
    environment:
      - AUTOTRADER_DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Data validation service
  validate:
    build: .
    network_mode: "none"
    read_only: true
    command: ["validate_data.py", "--checksums"]
    volumes:
      - ${DATA_DIR:-~/.cache/autotrader/data}:/app/data:ro
    environment:
      - AUTOTRADER_DATA_DIR=/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
